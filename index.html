<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบสารบรรณ + ฐานข้อมูล อบต.บก</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>📄 ระบบสารบรรณ + ฐานข้อมูลรายชื่อ</h1>
      <p class="note">องค์การบริหารส่วนตำบลบก — เลือก-เพิ่ม-ลบ หน่วยงาน & ผู้ลงนาม</p>
    </header>

    <!-- === จัดการฐานข้อมูล === -->
    <section class="card">
      <h2>📂 จัดการฐานข้อมูล</h2>
      
      <!-- แท็บเลือก -->
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('dept')">หน่วยงาน</button>
        <button class="tab-btn" onclick="switchTab('signer')">ผู้ลงนาม</button>
      </div>

      <!-- === แท็บ: หน่วยงาน === -->
      <div id="deptTab" class="tab-content">
        <div class="form-row inline">
          <input type="text" id="newDeptName" placeholder="ชื่อหน่วยงาน">
          <button class="btn success" onclick="addDept()">+ เพิ่ม</button>
        </div>
        <div id="deptList" class="list-box"></div>
        <small>💡 เลือกหลายรายการเพื่อสร้างหนังสือเวียน</small>
      </div>

      <!-- === แท็บ: ผู้ลงนาม === -->
      <div id="signerTab" class="tab-content" style="display:none;">
        <div class="form-row inline">
          <input type="text" id="newSignerName" placeholder="ชื่อ-สกุล">
          <input type="text" id="newSignerPos" placeholder="ตำแหน่ง">
          <button class="btn success" onclick="addSigner()">+ เพิ่ม</button>
        </div>
        <div id="signerList" class="list-box"></div>
      </div>
    </section>

    <!-- === เขียนหนังสือ === -->
    <section class="card">
      <h2>✍️ เขียนหนังสือ</h2>
      
      <div class="form-row">
        <label>ประเภทหนังสือ</label>
        <select id="docType" onchange="updatePreview()">
          <option value="external" selected>หนังสือภายนอก / หนังสือเวียน</option>
          <option value="internal">หนังสือภายใน</option>
          <option value="order">คำสั่ง</option>
          <option value="announce">ประกาศ</option>
        </select>
      </div>

      <div class="form-row">
        <label>ส่งถึงหน่วยงาน <small>(เลือกหลายรายการได้)</small></label>
        <div id="selectedDepts" class="selected-box">
          <em>เลือกหน่วยงานจากด้านบน</em>
        </div>
        <button class="btn info" onclick="clearDeptSelection()">ล้างการเลือก</button>
      </div>

      <div class="form-row">
        <label>เรื่อง</label>
        <input type="text" id="docSubject" oninput="updatePreview()">
      </div>
      <div class="form-row">
        <label>อ้างถึง</label>
        <input type="text" id="docRef" oninput="updatePreview()">
      </div>
      <div class="form-row">
        <label>สิ่งที่ส่งมาด้วย</label>
        <input type="text" id="docAttach" oninput="updatePreview()">
      </div>
      <div class="form-row">
        <label>เนื้อความ</label>
        <textarea id="docBody" rows="8" placeholder="  พิมพ์เนื้อความตรงนี้..." oninput="updatePreview()"></textarea>
      </div>
      <div class="form-row">
        <label>ผู้ลงนาม</label>
        <select id="selectedSigner" onchange="updatePreview()">
          <option value="">-- เลือกผู้ลงนาม --</option>
        </select>
      </div>

      <div class="btn-group">
        <button class="btn primary" onclick="generateLetters()">📄 สร้างหนังสือตามรายชื่อ</button>
        <button class="btn success" onclick="saveAllData()">💾 สำรองข้อมูล</button>
        <button class="btn info" onclick="importData()">📂 นำเข้าข้อมูล</button>
        <input type="file" id="importFile" accept=".json" style="display:none" onchange="doImport(event)">
      </div>
    </section>

    <!-- === ตัวอย่าง === -->
    <section class="card">
      <h2>📋 ตัวอย่างหนังสือ</h2>
      <div class="preview-box" id="previewArea"></div>
    </section>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
